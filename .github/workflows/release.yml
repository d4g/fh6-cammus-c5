# Builds and tests the DLL on every push and pull request; on a tag "v*" it also packages the
# release zip (scripts/package.ps1) and publishes a GitHub release with the zip and its checksum.
name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only by the release step (creating the release)

jobs:
  build:
    runs-on: windows-latest
    env:
      # Same version as dll/rust-toolchain.toml, with the GNU host (links without Visual
      # Studio). Current rustup rejects a host in that file, so it is selected here; this
      # takes precedence over the file.
      RUSTUP_TOOLCHAIN: 1.93.0-x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7.0.1

      # rustup >= 1.28 no longer installs the active toolchain implicitly.
      - name: Install Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal

      - name: Test
        working-directory: dll
        run: cargo test --locked

      - name: Build
        working-directory: dll
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          ./scripts/package.ps1 -Version $version
          "PACKAGE=fh6-cammus-c5-$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Publish release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a suffix (v0.1.0-rc.1) becomes a pre-release.
        run: |
          # Build the array explicitly: `$x = if (...) { @('a') }` unrolls to a plain string,
          # and splatting a string passes its single characters.
          $extra = @()
          if ($env:GITHUB_REF_NAME.Contains('-')) { $extra += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME "dist/$env:PACKAGE.zip" "dist/$env:PACKAGE.zip.sha256" --title $env:GITHUB_REF_NAME --generate-notes --verify-tag @extra
