[package]
name = "fh6-ffb-fix"
version = "0.1.0"
edition = "2021"
description = "xinput1_3.dll proxy for Forza Horizon 6 that repairs 2-axis FFB effects for single-actuator HID PID wheels (Cammus C5)"
license = "Unlicense"
publish = false

[lib]
# The library name is the DLL name: FH6 imports XINPUT1_3.dll, so the build
# output target/release/xinput1_3.dll is copied into the game folder as is.
name = "xinput1_3"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[profile.release]
opt-level = 2
debug = false
